# Netlify Configuration for Puro Yorumları
# Automatic cache headers and build configuration

[build]
  command = "python build_site.py"
  publish = "site"

# Cache headers for sitemap.xml - CRITICAL for Google Search Console
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

# Cache headers for robots.txt
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "text/plain; charset=utf-8"

# Cache headers for all XML files
[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

# Cache headers for HTML files (7 days)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# Cache headers for static assets (1 year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent directory listing
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
