[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "public, max-age=604800, must-revalidate"
Content-Type = "text/html; charset=utf-8"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "1; mode=block"
